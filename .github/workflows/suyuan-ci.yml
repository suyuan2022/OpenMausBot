# The fork's whole CI: one job on a pull request into suyuan. Upstream's ci.yml starts 17 jobs on every pull request and
# is switched off in this repository's Actions settings (gh workflow disable ci.yml), not edited, so a merge from
# upstream never conflicts here. This job checks what a one-person fork needs before a merge: the types, the lint, the
# fork's own tests with whatever test files the pull request touched, and the web build. After the merge
# suyuan-release.yml builds the server and the package and proves the package starts.
name: suyuan · ci

on:
  pull_request:
    branches: [suyuan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suyuan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: the diff against the first parent is what the pull request touched.
          fetch-depth: 2
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm typecheck
      - run: pnpm lint
      - name: The fork's tests, and the test files this pull request touched
        run: |
          git diff --name-only --diff-filter=AM HEAD^1 HEAD -- '*.test.ts' '*.test.tsx' \
            | xargs pnpm exec vitest run server/suyuan src/suyuan .suyuan.test. scripts/testing/file-size-ratchet.test.ts
      - run: pnpm exec vite build
