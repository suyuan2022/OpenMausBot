# When CI fails on a daily sync PR (suyuan-sync.yml), rerun its failed jobs once while the PR is still open. Upstream's
# suite has timing-sensitive tests and crashing workers, so one failure may be a flake. A failure after the rerun is a
# real break: the owner is @-mentioned on the PR, which a comment from github-actions[bot] notifies them of.
# The rerun reports to the same "CI" check, so a green rerun lets the PR's auto-merge go ahead.
name: suyuan · retry sync CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  pull-requests: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt == 1
      && github.event.workflow_run.event == 'pull_request'
      && startsWith(github.event.workflow_run.head_branch, 'sync/upstream-')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Rerun the failed jobs while the PR is open
        run: |
          set -euo pipefail
          if [ -n "$PR" ] && [ "$(gh pr view "$PR" --json state -q .state)" = OPEN ]; then
            gh run rerun "$RUN" --failed
          fi
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt >= 2
      && github.event.workflow_run.event == 'pull_request'
      && startsWith(github.event.workflow_run.head_branch, 'sync/upstream-')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      OWNER: ${{ github.repository_owner }}
      URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Mention the owner on the PR
        run: |
          set -euo pipefail
          if [ -n "$PR" ] && [ "$(gh pr view "$PR" --json state -q .state)" = OPEN ]; then
            gh pr comment "$PR" --body "@$OWNER 这个同步 PR 的 CI 重跑之后还是失败，需要人看一下：$URL"
          fi
