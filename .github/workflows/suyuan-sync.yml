# Daily: merge upstream main into suyuan through a PR. A clean merge gets GitHub auto-merge, so it lands once the
# required check "CI" (branch protection on suyuan) passes, and that merge triggers suyuan-release. suyuan-sync-retry.yml
# reruns a failed CI once; a conflicting merge stays open for a person to resolve locally.
# SYNC_TOKEN is a fine-grained token for this repository only (Contents, Pull requests, Workflows: read and write).
# The default GITHUB_TOKEN cannot push upstream's workflow edits, PRs it opens never start CI, and merges it makes never
# start suyuan-release.
name: suyuan · sync upstream

on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suyuan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      # The merge step adds a remote named upstream, which gh would otherwise pick as the repository for every call.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require SYNC_TOKEN
        run: test -n "$GH_TOKEN" || { echo "::error::Repository secret SYNC_TOKEN is missing (see the comment at the top of this file)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: suyuan
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/milind-soni/OpenMausBot.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=current" >> "$GITHUB_OUTPUT"; exit 0
          fi
          short=$(git rev-parse --short upstream/main)
          branch="sync/upstream-$short"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if git merge --no-edit -m "Merge upstream main ($short)" upstream/main; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            git checkout -B "$branch"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git checkout -B "$branch" upstream/main
          fi
          git push -f origin "$branch"
      - name: Open the PR
        if: steps.merge.outputs.status != 'current'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          SHORT: ${{ steps.merge.outputs.short }}
          STATUS: ${{ steps.merge.outputs.status }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = clean ]; then
            body="原作者 main 分支截至 commit $SHORT 的更新，自动合并没有冲突。CI 通过后 GitHub 会自动合并，合并后自动打安装包。CI 失败会自动重跑一次，再失败就留在这里等人看。"
          else
            body="原作者 main 分支截至 commit $SHORT 的更新和 suyuan 有冲突，要在本地解：在 suyuan 上 git merge upstream/main，解完推到 suyuan，再关掉这个 PR。"
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base suyuan --head "$BRANCH" --title "同步原作者更新 $SHORT" --body "$body"
            pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          fi
          # An older sync PR that never landed is covered by this one, which carries all of upstream up to $SHORT.
          for old in $(gh pr list --state open --json number,headRefName \
              -q ".[] | select(.headRefName | startswith(\"sync/upstream-\")) | select(.headRefName != \"$BRANCH\") | .number"); do
            gh pr close "$old" --delete-branch --comment "由 #$pr 取代：它包含原作者 main 分支截至 commit $SHORT 的全部更新。"
          done
      - name: Merge once CI passes
        if: steps.merge.outputs.status == 'clean'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: gh pr merge "$BRANCH" --auto --merge --match-head-commit "$(git rev-parse HEAD)"
