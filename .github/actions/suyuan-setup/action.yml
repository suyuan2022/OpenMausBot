# pnpm, Node 24 and the dependencies, for every job of suyuan-ci.yml and suyuan-release.yml.
# No dependency cache: measured on this repository's runs (Nov 10), restoring setup-node's 560 MB pnpm store and then
# installing took 14-22 s, while installing from the npm registry with no cache took 11-18 s.
name: suyuan setup
description: pnpm, Node 24 and pnpm install --frozen-lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
